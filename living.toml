    "spec.toml:21 declares version = \"0.2.0\" for themql-runtime",
    "Cargo.toml:41 declares version = \"0.1\" for the same crate",
    "crates.io API for themql-runtime reports max_version 0.1.0 with 1 version (observed 2026-09-26)",
]
