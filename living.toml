# Living state for Metis-Avionics/Metis-Avionics.
#
# spec.toml says what the organisation intends and what has been observed.
# living.toml says what is actually true right now, what was verified, what
# remains, and every known disagreement between the two.
#
# Validate with: python3 scripts/validate.py

[handover]
status = "published"
phase = "constitution_published_and_gated"
last_updated = "2026-09-26T00:00:00Z"
agent = "opencode"
summary = """
Constitution for the Mētis Avionics control plane, published. spec.toml records
the organisation's identity, safety boundary, engineering doctrine, governance
rules, and a registry of all seven Metis-Avionics repositories — the six
members plus this control plane — and two explicitly related public fork
sources, every field verified on 2026-09-26. 20 discrepancies between
specification, implementation and recorded state are registered below. None of
them is fixed by this repository. The two programs in scripts/ are held to
pinned ruff and mypy gates that run on every push.
"""
