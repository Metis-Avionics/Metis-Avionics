File the high-severity discrepancies as issues in the repositories that own
them. Re-observe the registry before 2026-10-26, when the 30-day staleness
window expires and check C10 begins to fail. Confirm the copyright holder of
record: the published LICENSE names the organisation, not a person.
"""
