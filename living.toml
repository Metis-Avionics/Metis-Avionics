[[discrepancies]]
id = "D1"
severity = "high"
title = "economic-prv declares theMQL as a required dependency, but theMQL is not in its build graph"
observed_in = "Metis-Avionics/economic-prv"
evidence = [
    "spec.toml:18-25 declares [dependencies.theMQL] with required = true",
    "Cargo.toml:22,40-41 declare themql-core and themql-runtime under [workspace.dependencies], not [dependencies]",
    "no member crate manifest references themql (grep over crates/*/Cargo.toml returns nothing)",
    "Cargo.lock contains no package named themql-core or themql-runtime; thesix is present",
    "crates/cli/src/main.rs:385 mentions themql-runtime only inside a help string",
]
status = "accepted"
resolution_owner = "Metis-Avionics/economic-prv"
resolution = "Either consume theMQL for real (a member crate inherits the workspace dependency and Cargo.lock records themql-core 0.1.0) or delete the declaration from spec.toml:18-25. Verify with cargo tree -i themql-core."

[[discrepancies]]
id = "D2"
severity = "high"
title = "economic-prv specifies a theMQL version that has never been published"
