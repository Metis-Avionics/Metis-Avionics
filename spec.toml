# ─────────────────────────────────────────────────────────────────────────────
# Governance
# ─────────────────────────────────────────────────────────────────────────────

[governance]
changes_require_explicit_scope = true
architecture_changes_require_spec_update = true
breaking_changes_require_migration_plan = true
documentation_must_reflect_implementation = true
disagreements_are_recorded_not_overwritten = true
discrepancy_protocol = "docs/governance.md"

[governance.change_classes]
doctrine = "spec.toml sections other than repositories.registry; requires a CHANGELOG entry and a rationale."
registry = "repositories.registry and repositories.related entries; requires re-observation evidence, never invention."
discrepancy = "living.toml [[discrepancies]] entries; the only permitted way to record a spec/implementation mismatch."

[governance.repository_requirements]
license_required = true
ci_required = true
spec_file_required = true
living_state_required = true
agent_file_required = true
power_of_ten_required_for_safety_critical = true
requirements_enforced_in = "other repositories; recorded here, gaps tracked as discrepancies"

[governance.dependencies]
cross_repository_dependencies_must_be_explicit = true
prefer_crates_io_over_fork = true
forks_must_be_declared = true
revisions_must_be_pinned = true
unpinned_git_dependencies_prohibited = true
note = "seven decision 0003 is the reference implementation of this policy: prefer the org's published crates over a fork checkout, and let Cargo.lock checksums carry reproducibility."

# ─────────────────────────────────────────────────────────────────────────────
# Agent execution model
# ─────────────────────────────────────────────────────────────────────────────

[agent]
mode = "bounded_executor"
prompt = "AGENTS.md"
read_spec_first = true
may_modify_other_repositories = false

[agent.rules]
read_spec_first = true
inspect_before_modify = true
no_requirement_invention = true
no_scope_expansion = true
no_repository_invention = true
no_observation_editing = true
observations_are_not_intentions = true
validate_before_completion = true
never_hide_failures = true
never_claim_unvalidated_state = true
update_state_after_execution = true
record_discrepancies_explicitly = true
respect_safety_boundary = true

[agent.execution_model]
stages = ["parse", "normalize", "resolve", "execute", "validate", "ratchet"]

[agent.final_report]
fields = ["status", "specification", "state_change", "files", "validation", "remaining", "discrepancies"]
status_values = ["COMPLETE", "PARTIAL", "BLOCKED"]

# ─────────────────────────────────────────────────────────────────────────────
# State
# ─────────────────────────────────────────────────────────────────────────────

[state]
authoritative_spec = "spec.toml"
living_state = "living.toml"
session_state = "SESSION.md"
handover_state = "HANDOVER.md"
history = "CHANGELOG.md"
registry_schema = "schemas/repository.schema.toml"
validator = "scripts/validate.py"
docs_index = "docs/architecture.md"

# ─────────────────────────────────────────────────────────────────────────────
# Ratchet
# ─────────────────────────────────────────────────────────────────────────────

[ratchet]
enabled = true
adoption = "declared"
enforcement = "scripts/validate.py covers org-level consistency only; per-repository gates are enforced in those repositories."
scope_expansion = false
completed_work_reopens = false
remaining_work_only_decreases = true
observations_never_edited_to_match_intent = true
registry_requires_re_observation = true
