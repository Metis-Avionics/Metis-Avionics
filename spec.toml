# Metis-Avionics/Metis-Avionics — canonical machine-readable constitution.
#
# This repository is the CONTROL PLANE for Mētis Avionics. It is not a product.
# It contains no application code and no vendored subsystem.
#
# Authority order (highest first):
#   1. spec.toml        — intended state, doctrine, registry of observations
#   2. living.toml      — observed state, discrepancies, remaining work
#   3. docs/*.md        — generated-style human projections of the two above
#   4. AGENTS.md        — executable prompt for agents operating on this repo
#
# Registry entries are OBSERVATIONS, not intentions. Never edit an observation
# to match an intention: record a discrepancy instead (see living.toml).
#
# Validate with: python3 scripts/validate.py

spec_version = "0.1.0"
authority = "highest"
kind = "control_plane"
is_product = false

# ─────────────────────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────────────────────

[metis]
name = "Mētis Avionics"
slug = "Metis-Avionics"
repository = "Metis-Avionics/Metis-Avionics"
legal_form = "independent_lab"
license = "MIT"
founded = "2026-08"

[metis.identity]
type = "independent_avionics_lab"
mission = """
Develop open-source aerospace, avionics, simulation, intelligence and
engineering systems, and publish the architecture that governs them.
"""
mission_document = "docs/mission.md"
mission_provenance = "Adapted into docs/mission.md from the organisation statement 'The purpose of Metis Avionics' (metis.md, 2026-09-17). Adapted, not reproduced verbatim, and the original is not under version control; see remaining work R6."
principles = [
    "open_source",
    "engineering_rigor",
    "reproducibility",
    "determinism",
    "explicit_boundaries",
    "adversarial_resilience",
    "documentation_matches_reality",
]

[metis.scope]
domains = [
    "avionics",
    "aerospace",
    "guidance_navigation_control",
    "simulation",
    "message_and_query_runtimes",
    "data_access_and_caching",
    "intelligence_systems",
    "engineering_infrastructure",
]

[metis.non_goals]
items = [
    "operational_aviation_authority",
    "certification_claims",
    "commercial_product_management",
    "closed_source_dependency_lock_in",
    "undocumented_proprietary_interfaces",
    "manufactured_project_relationships",
    "placeholder_repositories",
]

# ─────────────────────────────────────────────────────────────────────────────
# Safety — binding on every agent, document and publication of this org
# ─────────────────────────────────────────────────────────────────────────────

[metis.safety]
binding = true
statement = """
Mētis Avionics systems are research and engineering platforms. They must never
issue ATC clearances, command aircraft, provide separation assurance,
autonomously direct aircraft, claim certification, or present experimental
state as authoritative aviation state.
"""
provenance = "Metis-Avionics/seven README.md:8-11 (spec §21 safety boundary), adopted org-wide."
prohibitions = [
    "issue_atc_clearances",
    "command_aircraft",
    "provide_separation_assurance",
    "autonomously_direct_aircraft",
    "claim_certification",
    "present_experimental_state_as_authoritative",
]
applies_to = ["all_repositories", "all_agent_output", "all_published_documentation"]

# ─────────────────────────────────────────────────────────────────────────────
# Repositories
# ─────────────────────────────────────────────────────────────────────────────

[repositories]
source_of_truth = "repositories.registry"
registry_is = "observation"
observations_are_not_intentions = true
entry_must_be_verifiable = true
verification_sources = ["github_api", "local_clone", "crates_io_api"]

[repositories.policy]
every_repository_has_scope = true
every_repository_has_owner = true
every_repository_has_status = true
every_repository_has_documented_dependencies = true
cross_repository_dependencies_must_be_explicit = true
unverifiable_entries_go_to_unverified = true

[repositories.conventions]
spec_file = "spec.toml"
spec_file_casing = "lowercase"
living_file = "living.toml"
session_file = "SESSION.md"
handover_file = "HANDOVER.md"
changelog_file = "CHANGELOG.md"
agent_file = "AGENTS.md"
markdown_is_projection = true
toml_is_memory = true

[repositories.observed]
observed_at = "2026-09-26T00:00:00Z"
observed_via = [
    "gh api orgs/Metis-Avionics/repos",
    "git rev-parse / remote -v on local clones",
    "crates.io api /api/v1/crates/{name}",
]
entry_count = 7
stale_after_days = 30

