# ─────────────────────────────────────────────────────────────────────────────
# Engineering doctrine
# ─────────────────────────────────────────────────────────────────────────────

[engineering]
spec_first = true
deterministic = true
reproducible = true
test_first = true
automation_preferred = true
bounded_agent_execution = true
state_toml_is_memory = true
markdown_is_projection = true
verification_beats_assertion = true

[engineering.rust]
preferred = true
edition = "2024"
edition_adoption = "target"
edition_conforming = ["economic-prv"]
resolver = "3"
minimum_supported_rust = "1.98"
minimum_supported_rust_adoption = "declared_target"

[engineering.power_of_ten]
mandatory_for_safety_critical = true
present_in = ["economic-prv", "theLiGI", "theMQL", "theDAF"]
checker = "economic-prv scripts/tetanus-check.py"
thresholds = "economic-prv tetanus.toml [thresholds]"

[engineering.quality_gates]
org_level_enforcement = "per_repository"
note = "This repository does not claim to enforce the gates of other repositories. It records that they exist, and that they are absent where ci = \"none\". Its own gates are recorded here too: an organisation that does not hold itself to its doctrine has no doctrine."
